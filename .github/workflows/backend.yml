name: Backend CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and test all backend modules
        # -fae: chạy hết mọi module rồi mới báo lỗi, để biết module nào xanh/đỏ thay vì bị SKIPPED.
        run: mvn -B -ntp -fae verify
        env:
          # Test tích hợp Redis (libs/common) chỉ chạy khi có REDIS_HOST; Redis không mật khẩu, chỉ sống trong job.
          REDIS_HOST: localhost
          REDIS_PORT: '6379'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: backend-test-reports
          path: '**/target/surefire-reports/*.xml'
          retention-days: 3
