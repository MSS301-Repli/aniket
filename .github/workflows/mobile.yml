name: Mobile CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Ghim để khớp `environment.sdk: ^3.13.7` trong pubspec.yaml (Flutter 3.47.9 = Dart 3.13.7).
          flutter-version: '3.47.9'
          cache: true
      - name: Install dependencies (generates l10n)
        run: flutter pub get
      - run: flutter analyze
      - run: flutter test
