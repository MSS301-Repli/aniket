name: Secret scan

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # quét toàn bộ commit của PR/push, không chỉ HEAD
      # Dùng CLI gitleaks (MIT) thay vì gitleaks-action để không cần license cho repo của tổ chức.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Scan git history
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || '' }}
        run: |
          if [ -n "$RANGE" ]; then
            gitleaks git --redact --verbose --log-opts="$RANGE" .
          else
            # Push: chỉ lịch sử của commit đang build (mặc định gitleaks quét --all, kéo theo branch của người khác).
            gitleaks git --redact --verbose --log-opts="HEAD" .
          fi
