# Cập nhật dependency tự động: PR nhỏ, gom nhóm, mở vào dev (squash merge như PR thường).
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    target-branch: dev
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    commit-message: { prefix: "build(deps)" }
    groups:
      # Spring Boot/Cloud chỉ đổi qua PR PLT có chủ đích (root pom), không nâng lẻ từng starter.
      spring:
        patterns: ["org.springframework*"]
        update-types: [patch]
      others:
        patterns: ["*"]
        exclude-patterns: ["org.springframework*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "org.springframework.boot:spring-boot-starter-parent"
        update-types: [version-update:semver-major, version-update:semver-minor]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule: { interval: monthly }
    commit-message: { prefix: "ci(deps)" }
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pub
    directory: /mobile
    target-branch: dev
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    commit-message: { prefix: "build(mobile)" }
    groups:
      flutter:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /deploy/docker
    target-branch: dev
    schedule: { interval: monthly }
    commit-message: { prefix: "build(docker)" }
