server:
  port: 8080

spring:
  application:
    name: api-gateway
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    config:
      username: ${CONFIG_USER:config}
      # Không có mật khẩu mặc định; chạy ngoài compose thì đặt CONFIG_PASSWORD (hoặc spring.cloud.config.enabled=false).
      password: ${CONFIG_PASSWORD:}
      fail-fast: false
    gateway:
      # Chỉ route theo tiền tố công khai; /internal/** không có route và còn bị chặn ở GatewayConfig.
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/v1/users/**,/api/v1/friends/**,/api/v1/blocks/**,/api/v1/reports/**,/api/v1/animals/**,/api/v1/devices/**
        - id: post-service
          uri: lb://post-service
          predicates:
            - Path=/api/v1/posts/**,/api/v1/feed/**
        - id: media-service
          uri: lb://media-service
          predicates:
            - Path=/api/v1/media/**
        - id: discovery-service
          uri: lb://discovery-service
          predicates:
            - Path=/api/v1/discovery/**
        - id: chat-ws
          uri: lb:ws://chat-service
          predicates:
            - Path=/ws/**
        - id: chat-service
          uri: lb://chat-service
          predicates:
            - Path=/api/v1/chat/**
        - id: billing-service
          uri: lb://billing-service
          predicates:
            - Path=/api/v1/billing/**,/webhooks/**,/pay/**
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_URI:http://localhost:8081/realms/animal-locket/protocol/openid-connect/certs}

animal:
  # Khoá gọi /internal/** của user-service. Bắt buộc, không có mặc định: trống thì IdentityFilter chặn khởi động.
  internal-token: ${INTERNAL_TOKEN:}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: ${TRACE_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
