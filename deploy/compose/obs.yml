# OBS (tuỳ chọn): Prometheus (+ luật cảnh báo), kafka-exporter, Loki, Tempo, Alloy, Grafana. Được include từ docker-compose.yml.
# Bật: docker compose --profile core --profile obs up -d   (Grafana qua Traefik: grafana.<PUBLIC_DOMAIN>)

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: [obs]
    restart: unless-stopped
    networks: [animal-net]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./deploy/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 6

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    profiles: [obs]
    restart: unless-stopped
    networks: [animal-net]
    command: ["--kafka.server=kafka:9092"]
    depends_on:
      kafka:
        condition: service_healthy

  loki:
    image: grafana/loki:3.2.1
    profiles: [obs]
    restart: unless-stopped
    networks: [animal-net]
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./deploy/observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  tempo:
    image: grafana/tempo:2.6.1
    profiles: [obs]
    restart: unless-stopped
    networks: [animal-net]
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./deploy/observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    # Image Tempo không có shell/wget nên không khai báo healthcheck.

  alloy:
    image: grafana/alloy:v1.4.3
    profiles: [obs]
    restart: unless-stopped
    networks: [animal-net]
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    depends_on:
      - loki
    volumes:
      - ./deploy/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro

  grafana:
    image: grafana/grafana:11.3.1
    profiles: [obs]
    restart: unless-stopped
    networks: [animal-net]
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Thiếu GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: http://grafana.${PUBLIC_DOMAIN:-localhost}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=animal-net"
      - "traefik.http.routers.grafana.rule=Host(`grafana.${PUBLIC_DOMAIN:-localhost}`)"
      - "traefik.http.routers.grafana.entrypoints=web,websecure"
      - "traefik.http.routers.grafana.middlewares=security-headers-ui@file"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

networks:
  animal-net:
    name: animal-net

volumes:
  prometheus-data:
  loki-data:
  tempo-data:
  alloy-data:
  grafana-data:
